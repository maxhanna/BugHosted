<div class="mtg-arena componentMain">
  <app-title-bar [title]="'MTG Arena'" (closeClicked)="remove_me('MtwArenaComponent')"></app-title-bar>
  <div class="world-wrap"><canvas #worldCanvas class="world" tabindex="0"></canvas>
    <div class="world-status">{{status}}</div><div class="prompt">{{interactPrompt}}</div>
    <div class="chat-bubble" *ngIf="chatLog.length"><span *ngFor="let line of chatLog">{{line}}</span></div>
    <form class="chat" (submit)="$event.preventDefault(); sendChat()"><input [(ngModel)]="chatMessage" name="chatMessage" placeholder="Say something in the pub…" maxlength="180"><button type="submit">Chat</button></form>
    <div class="deck-table" *ngIf="selectedDeck"><h3>{{selectedDeck.name}}</h3><div class="cards"><img *ngFor="let card of selectedDeck.cards" [src]="card.imageUri" [alt]="card.name"></div><button type="button" (click)="selectedDeck=undefined">Close deck</button></div>
  </div>
</div>
