<div class="boot">

  <!-- The scene: the game medium slides in behind the hardware and disappears
       into the slot. Everything is pure CSS so it costs nothing while the ROM
       is still downloading. -->
  <div class="stage"
    [ngClass]="['stage--' + visual.media, 'stagebody--' + visual.body, 'shape--' + visual.shape, visual.wide ? 'stage--wide' : '']">
    <img *ngIf="coverSrc" class="stage-art" [src]="coverSrc" alt="" aria-hidden="true" (error)="onCoverError()" />
    <span class="stage-veil"></span>
    <span class="stage-glow"></span>

    <!-- Medium (behind the machine, so it is "swallowed" by the slot) -->
    <div class="asset asset--disc" *ngIf="visual.media === 'disc'">
      <div class="disc">
        <span class="disc-face"></span>
        <span class="disc-label" [class.has-art]="!!coverSrc" [style.backgroundColor]="visual.accent">
          <img *ngIf="coverSrc" class="label-art" [src]="coverSrc" alt="" (error)="onCoverError()" />
          <ng-container *ngIf="!coverSrc">
            <span class="disc-title">{{ title }}</span>
            <span class="disc-brand">{{ visual.hardware }}</span>
          </ng-container>
        </span>
        <span class="disc-hole"></span>
      </div>
    </div>

    <div class="asset asset--cart" *ngIf="visual.media === 'cartridge'">
      <div class="cartridge">
        <span class="cart-ribs"></span>
        <span class="cart-label" [class.has-art]="!!coverSrc" [style.borderColor]="visual.accent">
          <img *ngIf="coverSrc" class="label-art" [src]="coverSrc" alt="" (error)="onCoverError()" />
          <ng-container *ngIf="!coverSrc">
            <span class="cart-brand" [style.color]="visual.accent">{{ visual.hardware }}</span>
            <span class="cart-title">{{ title }}</span>
          </ng-container>
        </span>
        <span class="cart-pins"></span>
      </div>
    </div>

    <div class="asset asset--floppy" *ngIf="visual.media === 'floppy'">
      <div class="floppy">
        <span class="floppy-shutter"></span>
        <span class="floppy-label" [class.has-art]="!!coverSrc">
          <img *ngIf="coverSrc" class="label-art" [src]="coverSrc" alt="" (error)="onCoverError()" />
          <ng-container *ngIf="!coverSrc">
            <span class="floppy-title">{{ title }}</span>
            <span class="floppy-brand">{{ visual.hardware }}</span>
          </ng-container>
        </span>
      </div>
    </div>

    <div class="asset asset--coin" *ngIf="visual.media === 'coin'">
      <span class="coin">★</span>
    </div>

    <!-- Manufacturer badge, shared by every body shape. -->
    <ng-template #badge>
      <span class="badge" *ngIf="visual.mark" [ngClass]="'badge--' + visual.mark">
        <span class="mark" [ngClass]="'mark--' + visual.mark">{{ markText }}</span>
        <span class="wordmark">{{ visual.wordmark || visual.hardware }}</span>
      </span>
      <span class="brand" *ngIf="!visual.mark">{{ visual.wordmark || visual.hardware }}</span>
    </ng-template>

    <!-- Hardware -->
    <div class="device device--console" *ngIf="visual.body === 'console'"
      [ngClass]="'shape--' + visual.shape" [class.has-wood]="!!visual.wood"
      [style.background]="visual.shell" [style.color]="visual.ink || '#e6ecf5'">
      <span class="wood" *ngIf="visual.wood"></span>
      <span class="seam"></span>
      <span class="tray"></span>
      <span class="bump"></span>
      <span class="handle"></span>
      <span class="device-trim" [style.background]="visual.accent"></span>
      <span class="lid lid--disc" *ngIf="visual.lid === 'disc'"></span>
      <span class="lid lid--cart" *ngIf="visual.lid === 'cartridge'"></span>
      <span class="vents" *ngIf="visual.lid === 'cartridge'"></span>
      <span class="tagline" *ngIf="visual.tagline" [style.background]="visual.accent">{{ visual.tagline }}</span>
      <span class="ports" *ngIf="visual.ports"><i *ngFor="let p of slots(visual.ports)"></i></span>
      <span class="front-buttons" *ngIf="visual.buttons"><i *ngFor="let b of slots(visual.buttons)"></i></span>
      <ng-container *ngTemplateOutlet="badge"></ng-container>
      <span class="slot slot--disc" *ngIf="visual.media === 'disc'"></span>
      <span class="slot slot--cart" *ngIf="visual.media === 'cartridge'"></span>
      <span class="led" [style.background]="visual.accent" [style.boxShadow]="'0 0 10px ' + visual.accent"></span>
      <span class="sheen"></span>
    </div>

    <div class="device device--handheld" *ngIf="visual.body === 'handheld'"
      [ngClass]="'shape--' + visual.shape"
      [style.background]="visual.shell" [style.color]="visual.ink || '#e6ecf5'">
      <span class="handheld-screen"></span>
      <span class="handheld-screen handheld-screen--lower"></span>
      <span class="hinge"></span>
      <span class="handheld-dpad"></span>
      <span class="handheld-buttons" [style.borderColor]="visual.accent"></span>
      <span class="handheld-speaker"></span>
      <span class="slot slot--cart" *ngIf="visual.media === 'cartridge'"></span>
      <ng-container *ngTemplateOutlet="badge"></ng-container>
      <span class="led" [style.background]="visual.accent" [style.boxShadow]="'0 0 10px ' + visual.accent"></span>
      <span class="sheen"></span>
    </div>

    <div class="device device--desk" *ngIf="visual.body === 'desk'" [ngClass]="'shape--' + visual.shape"
      [style.background]="visual.shell" [style.color]="visual.ink || '#e6ecf5'">
      <span class="desk-screen"></span>
      <span class="drive"></span>
      <span class="desk-keys" [style.backgroundColor]="visual.accent"></span>
      <span class="slot slot--floppy" *ngIf="visual.media === 'floppy'"></span>
      <ng-container *ngTemplateOutlet="badge"></ng-container>
      <span class="led" [style.background]="visual.accent" [style.boxShadow]="'0 0 10px ' + visual.accent"></span>
      <span class="sheen"></span>
    </div>

    <div class="device device--cabinet" *ngIf="visual.body === 'cabinet'" [ngClass]="'shape--' + visual.shape"
      [style.background]="visual.shell" [style.color]="visual.ink || '#e6ecf5'">
      <span class="marquee" [style.background]="visual.accent">{{ visual.hardware }}</span>
      <span class="cab-screen"></span>
      <span class="cab-panel" [style.borderColor]="visual.accent"></span>
      <span class="cab-stick"></span>
      <span class="cab-buttons"><i></i><i></i><i></i></span>
      <span class="coin-door"><i></i><i></i></span>
      <span class="slot slot--coin" *ngIf="visual.media === 'coin'"></span>
      <span class="led" [style.background]="visual.accent" [style.boxShadow]="'0 0 10px ' + visual.accent"></span>
      <span class="sheen"></span>
    </div>
  </div>

  <div class="boot-caption" *ngIf="caption as text">
    <span class="caption-text">{{ text }}</span>
    <span class="caption-dots"><i>.</i><i>.</i><i>.</i></span>
  </div>

  <div class="boot-bar" *ngIf="progressPct !== null">
    <div class="boot-bar-fill" [style.width.%]="progressPct"></div>
  </div>

  <div class="boot-status" *ngIf="status">{{ status }}</div>
</div>
